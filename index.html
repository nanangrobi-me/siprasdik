    function applyAppTheme(themeKey, persist = true) {
      const theme = APP_THEMES[themeKey] || APP_THEMES.lime;
      const root = document.documentElement;
      root.style.setProperty('--theme-accent', theme.accent);
      root.style.setProperty('--theme-accent-rgb', theme.accentRgb);
      root.style.setProperty('--theme-accent-hover', theme.accentHover);
      root.style.setProperty('--theme-secondary', theme.secondary);
      root.style.setProperty('--theme-secondary-rgb', theme.secondaryRgb);
      root.style.setProperty('--theme-canvas', theme.canvas);
      root.style.setProperty('--theme-surface', theme.surface);
      root.style.setProperty('--theme-surface-hover', theme.surfaceHover);
      root.style.setProperty('--theme-border', theme.border);
      root.style.setProperty('--theme-on-accent', theme.onAccent);

      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', theme.canvas);

      if (persist) {
        try { localStorage.setItem('sim_sarpras_theme_v1', theme.id); } catch (e) {}
      }
      return theme.id;
    }

    const LOGIN_HERO_CACHE_KEY = "sim_sarpras_login_hero_cache_v2";

    function getEmbeddedLoginHeroSrc() {
      try {
        const cached = localStorage.getItem(LOGIN_HERO_CACHE_KEY);
        if (cached && cached.startsWith("data:image/")) return cached;
      } catch (e) {}
      return LOGIN_HERO_IMAGE_URL;
    }

    function cacheLoginHeroImage(imgEl) {
      try {
        if (!imgEl || !imgEl.src || imgEl.src.startsWith("data:image/")) return;
        const maxW = 960;
        const ratio = imgEl.naturalWidth > maxW ? (maxW / imgEl.naturalWidth) : 1;
        const w = Math.max(1, Math.round(imgEl.naturalWidth * ratio));
        const h = Math.max(1, Math.round(imgEl.naturalHeight * ratio));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(imgEl, 0, 0, w, h);
        const dataUri = canvas.toDataURL("image/png");
        if (dataUri && dataUri.length > 200) {
          localStorage.setItem(LOGIN_HERO_CACHE_KEY, dataUri);
        }
      } catch (e) {}
    }

    window.handleLoginHeroLoad = function(imgEl) {
      cacheLoginHeroImage(imgEl);
    };

    window.handleLoginHeroError = function(imgEl) {
      if (!imgEl) return;
      if (imgEl.hasAttribute("crossorigin")) {

    // =========================================================================
    // 1A. FUNGSI HELPER FORMAT, ESCAPE, SANITASI GAMBAR, GPS & STATE UTAMA
    // =========================================================================
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizeImageDataUrl(uri) {
      if (!uri || typeof uri !== 'string') return '';
      const trimmed = uri.trim();
      if (trimmed.startsWith('data:image/')) return trimmed;
      return '';
    }

    // Batas aman maksimal panjang string Base64 gambar untuk Firestore (1 field max 1.048.487 bytes)
    const MAX_FIRESTORE_IMAGE_CHARS = 750000;

    function getByteLengthUtf8(str) {
      if (!str) return 0;
      try {
        return new TextEncoder().encode(str).length;
      } catch (e) {
        return str.length;
      }
    }

    function safeArg(str) {
      return encodeURIComponent(String(str ?? ''));
    }

    function decodeArg(str) {
      try {
        return decodeURIComponent(String(str ?? ''));
      } catch (e) {
        return String(str ?? '');
      }
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('id-ID').format(Number(num) || 0);
    }

    function formatRupiah(num) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(Number(num) || 0);
    }

    function formatTanggalIndonesia(dateObj = new Date()) {
      const bulan = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      return `${dateObj.getDate()} ${bulan[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
    }

    function renderKecamatanOptions(selectedVal = '') {
      const list = [...new Set([...KECAMATAN_KUTIM, ...(selectedVal ? [selectedVal] : [])])];
      return list.map(k =>
        `<option value="${escapeHTML(k)}" ${k === selectedVal ? 'selected' : ''}>${escapeHTML(k)}</option>`
      ).join('');
    }

    function isValidCoordinatePair(lat, lng) {
      if (lat === '' || lng === '' || lat === null || lng === null || lat === undefined || lng === undefined) return false;
      const latNum = Number(lat);
      const lngNum = Number(lng);
      if (Number.isNaN(latNum) || Number.isNaN(lngNum)) return false;
      return latNum >= -90 && latNum <= 90 && lngNum >= -180 && lngNum <= 180;
    }

    function buildGoogleMapsLink(lat, lng) {
      return `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`;
    }

    function buildMapEmbedUrl(lat, lng) {
      const latNum = parseFloat(lat);
      const lngNum = parseFloat(lng);
      const delta = 0.008;
      const bbox = `${(lngNum - delta).toFixed(6)},${(latNum - delta).toFixed(6)},${(lngNum + delta).toFixed(6)},${(latNum + delta).toFixed(6)}`;
      return `https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${encodeURIComponent(latNum.toFixed(6))},${encodeURIComponent(lngNum.toFixed(6))}`;
    }

      const latEl = document.getElementById(`${prefix}-latitude`);
      const lngEl = document.getElementById(`${prefix}-longitude`);

      if (!latEl || !lngEl || !boxEl) return;

      const lat = latEl.value.trim();
      const lng = lngEl.value.trim();
      if (isValidCoordinatePair(lat, lng)) {
        boxEl.innerHTML = `
          <div class="rounded-xl overflow-hidden border border-[#232926] bg-[#141816]">
            <iframe src="${buildMapEmbedUrl(lat, lng)}" class="w-full h-40 border-0" loading="lazy"></iframe>
            <div class="px-3 py-2 bg-[#141816] border-t border-[#232926] flex items-center justify-between text-xs">
              <span class="font-mono text-[#A3E635]">${parseFloat(lat).toFixed(6)}, ${parseFloat(lng).toFixed(6)}</span>

      showToast('Sedang mendeteksi titik lokasi GPS...', 'info');

      navigator.geolocation.getCurrentPosition(

    function applyAutoColumnWidths(ws, rows, minWidth = 10, maxWidth = 42) {
      if (!rows || rows.length === 0) return;
      const colCount = rows.reduce((max, r) => Math.max(max, r.length), 0);
      const cols = [];
      for (let c = 0; c < colCount; c++) {
        let longest = minWidth;
        for (let r = 0; r < rows.length; r++) {
          if (r < 3) continue;
          const cellVal = rows[r][c] !== null && rows[r][c] !== undefined ? String(rows[r][c]) : '';
          if (cellVal.length + 3 > longest) longest = cellVal.length + 3;
        }
        cols.push({ wch: Math.min(maxWidth, longest) });
      }
      ws['!cols'] = cols;
    }

    let fbApp = null;

    function npsnToAuthEmail(npsn) {
      return `${String(npsn || '').trim().toLowerCase()}@${SCHOOL_AUTH_DOMAIN}`;
    }

    function normalizeSchoolAuthPassword(rawPass) {
      const clean = String(rawPass || '').trim();
      if (clean.length >= 6) return clean;
      return `${clean}_kutim`;
    }

    async function initFirebaseIfProduction() {
      if (IS_PREVIEW) return;
      if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("ISI_DENGAN_")) {
        showToast("Konfigurasi Firebase belum diisi! Lengkapi firebaseConfig terlebih dahulu.", "error");
        return;
      }
      try {
        const [appMod, authMod, fsMod] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
        ]);
        fbApp = appMod.initializeApp(firebaseConfig);
        const secondaryApp = appMod.initializeApp(firebaseConfig, "SchoolProvisionerApp");
        fbAuth = authMod.getAuth(fbApp);
        fbSecondaryAuth = authMod.getAuth(secondaryApp);
        fbDb = fsMod.getFirestore(fbApp);
        fbModules = { ...authMod, ...fsMod };
      } catch (error) {
        console.error("Gagal memuat Firebase SDK:", error);
        showToast("Gagal menginisialisasi koneksi Firebase. Periksa konfigurasi.", "error");
      }
    }

    async function provisionSchoolFirebaseAuth(npsn, rawPassword) {
      if (IS_PREVIEW || !fbSecondaryAuth || !fbModules) return null;
      const { createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword, signOut } = fbModules;
      const email = npsnToAuthEmail(npsn);
      const authPass = normalizeSchoolAuthPassword(rawPassword);

      try {
        const cred = await createUserWithEmailAndPassword(fbSecondaryAuth, email, authPass);
        const uid = cred.user.uid;
        await signOut(fbSecondaryAuth);
        return { uid, email };
      } catch (err) {
        if (err.code === 'auth/email-already-in-use') {
          try {
            const cred = await signInWithEmailAndPassword(fbSecondaryAuth, email, authPass);
            const uid = cred.user.uid;
            await updatePassword(cred.user, authPass);
            await signOut(fbSecondaryAuth);
            return { uid, email };
          } catch (innerErr) {
            return { email };
          }
        }
        throw err;
      }

    function computeSarprasStats(schoolNpsn = null) {
      const targetSarana = schoolNpsn
        ? state.sarana.filter(s => s.school_npsn === schoolNpsn)
        : state.sarana;
      const targetPrasarana = schoolNpsn
        ? state.prasarana.filter(p => p.school_npsn === schoolNpsn)
        : state.prasarana;
      const targetUsulan = schoolNpsn
        ? state.usulan.filter(u => u.school_npsn === schoolNpsn)
        : state.usulan;

      let baikUnit = 0;
      let ringanUnit = 0;
      let beratUnit = 0;

      targetSarana.forEach(item => {
        baikUnit += Number(item.jumlah_baik) || 0;
        ringanUnit += Number(item.jumlah_rusak_ringan) || 0;
        beratUnit += Number(item.jumlah_rusak_berat) || 0;
      });

      targetPrasarana.forEach(room => {
        const weight = 10;
        if (room.kondisi === 'Baik') baikUnit += weight;
        else if (room.kondisi === 'Rusak Ringan') ringanUnit += weight;
        else if (room.kondisi === 'Rusak Berat') beratUnit += weight;
      });

      const totalUnit = baikUnit + ringanUnit + beratUnit;
      const pctBaik = totalUnit > 0 ? Math.round((baikUnit / totalUnit) * 100) : 0;
      const pctRingan = totalUnit > 0 ? Math.round((ringanUnit / totalUnit) * 100) : 0;
      const pctBerat = totalUnit > 0 ? Math.max(0, 100 - pctBaik - pctRingan) : 0;
      const pctRusakTotal = totalUnit > 0 ? Math.max(0, 100 - pctBaik) : 0;

      let statusLabel = 'Belum Ada Data';
      if (totalUnit > 0) {
        if (pctBerat >= 25) statusLabel = 'Rusak Berat';
        else if (pctRusakTotal >= 20) statusLabel = 'Rusak Ringan';
        else statusLabel = 'Baik';
      }

      return {
        totalSchools: state.schools.length,
        totalSaranaItems: targetSarana.length,
        totalPrasaranaItems: targetPrasarana.length,
        baikUnit,
        ringanUnit,
        beratUnit,
        totalUnit,
        pctBaik,
        pctRingan,
        pctBerat,
        pctRusakTotal,
        statusLabel,
        totalUsulan: targetUsulan.length,
        usulanDisetujui: targetUsulan.filter(u => u.status === 'Disetujui').length,
        usulanMenunggu: targetUsulan.filter(u => u.status === 'Menunggu').length
      };
    }

    function clearFirestoreListeners() {
      if (Array.isArray(state.unsubscribers)) {
        state.unsubscribers.forEach(unsub => {
          try { if (typeof unsub === 'function') unsub(); } catch (e) {}
        });
      }
      state.unsubscribers = [];
    }

    function startRealtimeListeners() {
      if (IS_PREVIEW || !fbDb || !fbModules) return;
      clearFirestoreListeners();
      const { collection, onSnapshot } = fbModules;
      ['schools', 'sarana', 'prasarana', 'usulan'].forEach(colName => {
        const unsub = onSnapshot(collection(fbDb, colName), (snap) => {
          state[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderApp();
        }, (err) => {
          console.warn(`Listener ${colName}:`, err?.message);
        });
        state.unsubscribers.push(unsub);
      });
    }

    async function saveRecord(collectionName, docId, payload) {
      if (IS_PREVIEW) {
        if (docId) {
          const idx = state[collectionName].findIndex(item => item.id === docId || item.npsn === docId);
          if (idx !== -1) {
            state[collectionName][idx] = { ...state[collectionName][idx], ...payload };
          } else {
            const newId = payload.npsn || `${collectionName}-${Date.now()}`;
            state[collectionName].unshift({ id: newId, ...payload });
          }
        } else {
          const newId = payload.npsn || `${collectionName}-${Date.now()}`;
          state[collectionName].unshift({ id: newId, ...payload });
        }
        broadcastPreviewState(`Simpan ${collectionName}`);
        renderApp();
        return;
      }

      if (!fbDb || !fbModules) throw new Error("Koneksi Firebase belum siap.");
      const { collection, doc, setDoc, addDoc, updateDoc } = fbModules;

      const cleanPayload = { ...payload };
      if (collectionName === 'schools') {
        delete cleanPayload.password;
      }

      if (docId) {
        await updateDoc(doc(fbDb, collectionName, docId), cleanPayload);
      } else if (collectionName === 'schools' && cleanPayload.npsn) {
        await setDoc(doc(fbDb, 'schools', cleanPayload.npsn), cleanPayload);
      } else {
        await addDoc(collection(fbDb, collectionName), cleanPayload);
      }
    }

    async function deleteRecord(collectionName, docId) {
      if (IS_PREVIEW) {
        state[collectionName] = state[collectionName].filter(item => item.id !== docId);
        broadcastPreviewState(`Hapus ${collectionName}`);
        renderApp();
        return;
      }
      if (!fbDb || !fbModules) throw new Error("Koneksi Firebase belum siap.");
      const { doc, deleteDoc } = fbModules;
      await deleteDoc(doc(fbDb, collectionName, docId));
    }

    window.handleLoginSubmit = async function(e) {
      e.preventDefault();
      const form = e.target;
      state.loading = true;
      renderApp();

      try {
        if (state.loginTab === 'school') {
          const npsn = form.npsn.value.trim();
          const password = form.password.value.trim();

          if (!npsn || !password) {
            throw new Error("Masukkan NPSN dan Kata Sandi Sekolah.");
          }

          if (IS_PREVIEW) {
            const matched = state.schools.find(s => s.npsn === npsn && s.password === password);
            if (!matched) {
              throw new Error("NPSN atau Kata Sandi tidak cocok dengan akun demo.");
            }
            state.user = { role: 'school', ...matched };
            state.activeTab = 'beranda';
            showToast(`Selamat datang, Operator ${matched.nama_sekolah}`, 'success');
          } else {
            if (!fbAuth || !fbDb || !fbModules) throw new Error("Koneksi Firebase belum siap.");
            const { signInWithEmailAndPassword, doc, getDoc } = fbModules;
            const authEmail = npsnToAuthEmail(npsn);
            const authPass = normalizeSchoolAuthPassword(password);

            const cred = await signInWithEmailAndPassword(fbAuth, authEmail, authPass);
            const schoolRef = doc(fbDb, 'schools', npsn);
            const schoolSnap = await getDoc(schoolRef);

            if (!schoolSnap.exists()) {
              throw new Error("Profil sekolah belum terdaftar di database. Hubungi Admin Bidang SD.");
            }

            const schoolData = schoolSnap.data();
            state.user = {
              role: 'school',
              uid: cred.user.uid,
              id: schoolSnap.id,
              ...schoolData
            };
            state.activeTab = 'beranda';
            startRealtimeListeners();
            showToast(`Berhasil masuk sebagai ${state.user.nama_sekolah}`, 'success');
          }
        } else {
          const email = form.email.value.trim();
          const password = form.password.value.trim();

          if (!email || !password) {
            throw new Error("Masukkan Email dan Kata Sandi Admin Bidang SD.");
          }

          if (IS_PREVIEW) {
            if (email === 'admin@dinas.go.id' && password === 'admin123') {
              state.user = {
                role: 'admin',
                email: 'admin@dinas.go.id',
                nama: 'Admin Bidang Pembinaan SD Kutim'
              };
              state.activeTab = 'beranda';
              showToast('Berhasil masuk sebagai Admin Bidang Pembinaan SD', 'success');
            } else {
              throw new Error('Kredensial Admin demo tidak valid.');
            }
          } else {
            if (!fbAuth || !fbModules) throw new Error("Firebase Authentication belum siap.");
            const { signInWithEmailAndPassword } = fbModules;
            if (email.toLowerCase().endsWith(`@${SCHOOL_AUTH_DOMAIN}`)) {
              throw new Error("Akun sekolah tidak diizinkan masuk melalui tab Admin.");
            }
            const cred = await signInWithEmailAndPassword(fbAuth, email, password);
            state.user = {
              role: 'admin',
              uid: cred.user.uid,
              email: cred.user.email,
              nama: 'Admin Bidang Pembinaan SD Kutim'
            };
            state.activeTab = 'beranda';
            startRealtimeListeners();
            showToast('Autentikasi Admin Bidang Pembinaan SD berhasil.', 'success');
          }
        }
      } catch (err) {
        const msg = (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found')
          ? 'NPSN/Email atau Kata Sandi salah.'
          : (err.message || 'Gagal melakukan autentikasi.');
        showToast(msg, 'error');
      } finally {
        state.loading = false;
        renderApp();
      }
    };

    window.submitSchoolForm = async function(e, docId) {
      e.preventDefault();
      const f = e.target;
      const npsnVal = f.npsn.value.trim();
      const rawPassword = f.password ? f.password.value.trim() : '';
      const rawLat = f.latitude ? f.latitude.value.trim() : '';
      const rawLng = f.longitude ? f.longitude.value.trim() : '';

      if ((rawLat || rawLng) && !isValidCoordinatePair(rawLat, rawLng)) {
        showToast('Format koordinat GPS tidak valid. Latitude harus (-90 s.d 90) dan Longitude (-180 s.d 180).', 'error');
        return;
      }

      if (!docId) {
        const duplicate = state.schools.find(s => s.npsn === npsnVal);
        if (duplicate) {
          showToast(`NPSN ${npsnVal} sudah terdaftar atas nama ${duplicate.nama_sekolah}. Gunakan fitur Edit atau Generate Password.`, 'error');
          return;
        }
      }

      const payload = {
        npsn: npsnVal,
        auth_email: npsnToAuthEmail(npsnVal),
        nama_sekolah: f.nama_sekolah.value.trim(),
        jenjang: 'SD',
        status_sekolah: f.status_sekolah ? f.status_sekolah.value : 'Negeri',
        kecamatan: f.kecamatan.value.trim(),
        kepala_sekolah: f.kepala_sekolah.value.trim(),
        operator_nama: f.operator_nama.value.trim(),
        jumlah_siswa: Number(f.jumlah_siswa.value) || 0,
        jumlah_rombel: Number(f.jumlah_rombel.value) || 0,
        alamat: f.alamat.value.trim(),
        latitude: rawLat ? parseFloat(rawLat).toFixed(6) : '',
        longitude: rawLng ? parseFloat(rawLng).toFixed(6) : '',
        updated_at: new Date().toISOString().slice(0, 10)
      };

      if (IS_PREVIEW && rawPassword) {
        payload.password = rawPassword;
      }

      try {
        if (!IS_PREVIEW && state.user?.role === 'admin' && rawPassword) {
          const authInfo = await provisionSchoolFirebaseAuth(npsnVal, rawPassword);
          if (authInfo?.uid) payload.auth_uid = authInfo.uid;
        }

        await saveRecord('schools', docId, payload);
        if (state.user?.role === 'school') {
          state.user = { ...state.user, ...payload };
        }
        closeModal();
        showToast('Data profil & titik lokasi sekolah berhasil disimpan.', 'success');
        renderApp();
      } catch (err) {
        showToast(err.message || 'Gagal menyimpan data sekolah.', 'error');
      }
    };

    window.submitChangePasswordForm = async function(e) {
      e.preventDefault();
      const f = e.target;
      const oldPass = f.old_password.value.trim();
      const newPass = f.new_password.value.trim();
      const confirmPass = f.confirm_password.value.trim();

      if (newPass !== confirmPass) {
        showToast('Konfirmasi kata sandi baru tidak cocok.', 'error');
        return;
      }

      try {
        if (IS_PREVIEW) {
          const currentSchool = state.schools.find(s => s.npsn === state.user?.npsn) || state.user;
          if (oldPass !== (currentSchool?.password || '')) {
            showToast('Kata sandi lama tidak sesuai.', 'error');
            return;
          }
          const targetId = currentSchool?.id || state.user?.npsn;
          await saveRecord('schools', targetId, {
            password: newPass,
            updated_at: new Date().toISOString().slice(0, 10)
          });
          if (state.user) state.user.password = newPass;
        } else {
          if (!fbAuth || !fbModules || !fbAuth.currentUser) {
            throw new Error('Sesi autentikasi tidak ditemukan. Silakan login ulang.');
          }
          const { EmailAuthProvider, reauthenticateWithCredential, updatePassword } = fbModules;
          const credential = EmailAuthProvider.credential(fbAuth.currentUser.email, normalizeSchoolAuthPassword(oldPass));
          await reauthenticateWithCredential(fbAuth.currentUser, credential);
          await updatePassword(fbAuth.currentUser, normalizeSchoolAuthPassword(newPass));
        }

        closeModal();
        showToast('Kata sandi akun sekolah berhasil diperbarui.', 'success');
      } catch (err) {
        const msg = err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'
          ? 'Kata sandi lama tidak sesuai.'
          : (err.message || 'Gagal memperbarui kata sandi.');
        showToast(msg, 'error');
      }
    };

      const payload = {

        jenis_ruang: f.jenis_ruang.value,
        nama_ruang: f.nama_ruang.value.trim(),

        kondisi: f.kondisi.value,
        persentase_kerusakan: Number(f.persentase_kerusakan.value) || 0

    window.handleUsulanImageUpload = function(e) {
      const file = e.target?.files?.[0];
      if (!file) return;

      const isImageMime = file.type && file.type.startsWith('image/');
      const isImageExt = /\.(jpe?g|png|webp|gif|bmp|svg|ico|tiff?|avif|heic|heif|jfif)$/i.test(file.name);
      if (!isImageMime && !isImageExt) {
        showToast('File yang dipilih bukan gambar. Silakan pilih file gambar.', 'error');
        e.target.value = '';
        return;
      }

      const statusEl = document.getElementById('usulan-foto-status');
      if (statusEl) statusEl.textContent = 'Mengoptimalkan ukuran gambar...';

      const applyProcessedImage = function(dataUrl) {
        const safeUrl = sanitizeImageDataUrl(dataUrl);
        if (!safeUrl || getByteLengthUtf8(safeUrl) > MAX_FIRESTORE_IMAGE_CHARS) {
          showToast('Ukuran gambar masih terlalu besar untuk disimpan. Silakan pilih gambar lain yang lebih ringan.', 'error');
          if (statusEl) statusEl.textContent = 'Ukuran gambar terlalu besar';
          e.target.value = '';
          return;
        }
        const hiddenData = document.getElementById('usulan-foto-data');
        const hiddenName = document.getElementById('usulan-foto-name');
        const previewBox = document.getElementById('usulan-foto-preview-box');
        const previewImg = document.getElementById('usulan-foto-preview-img');
        const filenameEl = document.getElementById('usulan-foto-filename');

        const sizeKb = Math.round(getByteLengthUtf8(safeUrl) / 1024);
        if (hiddenData) hiddenData.value = safeUrl;
        if (hiddenName) hiddenName.value = file.name;
        if (previewImg) previewImg.src = safeUrl;
        if (filenameEl) filenameEl.textContent = `${file.name} (${sizeKb} KB)`;
        if (previewBox) previewBox.classList.remove('hidden');
        if (statusEl) statusEl.textContent = `Gambar siap dikirim (${sizeKb} KB)`;
        showToast('Dokumen gambar berhasil dioptimalkan dan siap dikirim.', 'success');
      };

      const compressImageToSafeLimit = function(img) {
        let maxDim = 960;
        let quality = 0.78;
        let bestDataUrl = '';

        for (let attempt = 0; attempt < 8; attempt++) {
          let width = img.width || maxDim;
          let height = img.height || maxDim;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.max(1, Math.round((height * maxDim) / width));
              width = maxDim;
            } else {
              width = Math.max(1, Math.round((width * maxDim) / height));
              height = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          // Isi latar putih agar gambar PNG transparan tidak menjadi hitam saat dikonversi ke JPEG
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          bestDataUrl = canvas.toDataURL('image/jpeg', quality);
          if (getByteLengthUtf8(bestDataUrl) <= MAX_FIRESTORE_IMAGE_CHARS) {
            return bestDataUrl;
          }

          quality = Math.max(0.35, quality - 0.12);
          maxDim = Math.max(420, Math.round(maxDim * 0.8));
        }

        return bestDataUrl;
      };

      const reader = new FileReader();
      reader.onload = function(ev) {
        const rawDataUrl = ev.target.result;

        if ((file.type === 'image/svg+xml' || /\.svg$/i.test(file.name)) && getByteLengthUtf8(rawDataUrl) <= MAX_FIRESTORE_IMAGE_CHARS) {
          applyProcessedImage(rawDataUrl);
          return;
        }

        const img = new Image();
        img.onload = function() {
          try {
            const compressed = compressImageToSafeLimit(img);
            applyProcessedImage(compressed);
          } catch (canvasErr) {
            applyProcessedImage(rawDataUrl);
          }
        };
        img.onerror = function() {
          applyProcessedImage(rawDataUrl);
        };
        img.src = rawDataUrl;
      };
      reader.readAsDataURL(file);
    };

    function generatePasswordFromNpsn(npsn, mode = 'npsn_acak') {
      const cleanNpsn = String(npsn || '').trim();
      if (mode === 'sama_npsn') return cleanNpsn.length >= 6 ? cleanNpsn : `${cleanNpsn}00`;
      if (mode === 'sd_npsn') return `SD${cleanNpsn}`;
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let suffix = '';
      for (let i = 0; i < 4; i++) {
        suffix += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      const prefix = cleanNpsn.slice(-4) || 'KUTM';
      return `${prefix}-${suffix}`;
    }

    window.submitBulkImportSchools = async function(e) {
      e.preventDefault();
      const raw = e.target.bulk_text.value.trim();
      if (!raw) return;

      const lines = raw.split(/\r?\n/).filter(l => l.trim());
      const today = new Date().toISOString().slice(0, 10);
      const existingNpsnSet = new Set(state.schools.map(s => s.npsn));
      const newRecords = [];
      let skippedCount = 0;

      for (const line of lines) {
        const parts = line.includes('\t') ? line.split('\t') : line.split(/[,;|]/);
        const npsn = (parts[0] || '').trim();
        const nama_sekolah = (parts[1] || '').trim();
        const kecamatan = (parts[2] || 'Kec. Sangatta Utara').trim();

        if (!npsn || !nama_sekolah) continue;
        if (existingNpsnSet.has(npsn)) {
          skippedCount++;
          continue;
        }
        existingNpsnSet.add(npsn);

        const defaultPass = `SD${npsn}`;
        const rec = {
          id: npsn,
          npsn,
          auth_email: npsnToAuthEmail(npsn),
          nama_sekolah,
          jenjang: 'SD',
          status_sekolah: nama_sekolah.toUpperCase().includes('SDN') || nama_sekolah.toUpperCase().includes('NEGERI') ? 'Negeri' : 'Swasta',
          kecamatan,
          alamat: '-',
          latitude: '',
          longitude: '',
          kepala_sekolah: '-',
          operator_nama: '-',
          jumlah_siswa: 0,
          jumlah_rombel: 0,
          updated_at: today
        };
        if (IS_PREVIEW) rec.password = defaultPass;
        newRecords.push({ rec, defaultPass });
      }

      if (newRecords.length > 0) {
        if (IS_PREVIEW) {
          state.schools = [...newRecords.map(x => x.rec), ...state.schools];
          broadcastPreviewState(`Import massal ${newRecords.length} Sekolah Dasar`);
        } else if (fbDb && fbModules?.writeBatch) {
          showToast(`Memproses ${newRecords.length} akun sekolah ke Firebase Auth & Firestore...`, 'info');
          const { writeBatch, doc } = fbModules;
          for (const item of newRecords) {
            try {
              const authInfo = await provisionSchoolFirebaseAuth(item.rec.npsn, item.defaultPass);
              if (authInfo?.uid) item.rec.auth_uid = authInfo.uid;
            } catch (authErr) {}
          }
          for (let i = 0; i < newRecords.length; i += 450) {
            const batch = writeBatch(fbDb);
            newRecords.slice(i, i + 450).forEach(item => {
              batch.set(doc(fbDb, 'schools', item.rec.npsn), item.rec);
            });
            await batch.commit();
          }
        }
      }

      closeModal();
      showToast(`Import selesai: ${newRecords.length} sekolah ditambahkan${skippedCount > 0 ? `, ${skippedCount} dilewati (NPSN sudah ada)` : ''}.`, 'success');
      renderApp();
    };

    window.seed320SchoolsBenchmark = function() {
      if (!IS_PREVIEW) return;
      const today = new Date().toISOString().slice(0, 10);
      const existingSet = new Set(state.schools.map(s => s.npsn));
      const generated = [];
      let counter = 1;

      while (state.schools.length + generated.length < 320 && counter <= 400) {
        const kec = KECAMATAN_KUTIM[(counter - 1) % KECAMATAN_KUTIM.length];
        const kecShort = kec.replace('Kec. ', '');
        const noUrut = String(Math.ceil(counter / KECAMATAN_KUTIM.length)).padStart(3, '0');
        const isSwasta = counter % 9 === 0;
        const npsn = String(30401000 + counter);

        if (!existingSet.has(npsn)) {
          existingSet.add(npsn);
          generated.push({
            id: npsn,
            npsn,
            password: `SD${npsn}`,
            auth_email: npsnToAuthEmail(npsn),
            nama_sekolah: isSwasta ? `SD Swasta YPPSB / IT ${noUrut} ${kecShort}` : `SD Negeri ${noUrut} ${kecShort}`,
            jenjang: 'SD',
            status_sekolah: isSwasta ? 'Swasta' : 'Negeri',
            kecamatan: kec,
            alamat: `Jl. Pendidikan No. ${counter}, ${kecShort}`,
            latitude: (0.45 + ((counter % 45) * 0.008)).toFixed(6),
            longitude: (117.15 + ((counter % 60) * 0.009)).toFixed(6),
            kepala_sekolah: `Kepala Sekolah SD ${noUrut}, S.Pd`,
            operator_nama: `Operator SD ${noUrut}`,
            jumlah_siswa: 120 + ((counter * 17) % 380),
            jumlah_rombel: 6 + (counter % 12),
            updated_at: today
          });
        }
        counter++;
      }

      state.schools = [...state.schools, ...generated];
      broadcastPreviewState(`Simulasi ${state.schools.length} Sekolah Dasar se-Kutai Timur dimuat`);
      closeModal();
      showToast(`Database kini menampung ${state.schools.length} Sekolah Dasar di 18 Kecamatan Kutai Timur!`, 'success');
      renderApp();
    };

              class="px-3.5 py-2 rounded-xl bg-[#0B0E0D] border border-[#232926] text-xs sm:text-sm text-white focus:border-[#A3E635] focus:outline-none">
              <option value="ALL">Semua Status Verifikasi</option>
              <option value="Menunggu" ${state.filters.usulanStatus === 'Menunggu' ? 'selected' : ''}>Menunggu Verifikasi</option>
              <option value="Disetujui" ${state.filters.usulanStatus === 'Disetujui' ? 'selected' : ''}>Disetujui</option>
              <option value="Ditolak" ${state.filters.usulanStatus === 'Ditolak' ? 'selected' : ''}>Ditolak</option>
            </select>
          </div>

          <div class="space-y-4">
            ${filtered.length === 0 ? `
              <div class="bento-card p-10 text-center text-gray-500 text-sm">
                Belum ada data usulan sarpras yang sesuai.
              </div>
            ` : filtered.map(u => {
              const statusBadge = u.status === 'Disetujui'
                ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30'
                : u.status === 'Ditolak'
                ? 'bg-red-500/15 text-red-400 border-red-500/30'
                : 'bg-amber-500/15 text-amber-400 border-amber-500/30';

              const prioColor = u.prioritas === 'Tinggi' ? 'text-red-400' : u.prioritas === 'Sedang' ? 'text-amber-400' : 'text-emerald-400';
              const safeImg = sanitizeImageDataUrl(u.foto_dokumen);

              return `
                <div class="bento-card p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                  <div class="space-y-1.5 flex-1">
                    <div class="flex flex-wrap items-center gap-2 text-xs">
                      <span class="px-2.5 py-0.5 rounded-lg bg-[#0B0E0D] border border-[#232926] text-[#A3E635] font-semibold">${escapeHTML(u.jenis_usulan)}</span>
                      <span class="font-semibold ${prioColor}">Prioritas ${escapeHTML(u.prioritas)}</span>
                      <span class="text-gray-600">•</span>
                      <span class="text-gray-400">${escapeHTML(u.created_at)}</span>
                      ${isAdmin ? `
                        <span class="text-gray-600">•</span>
                        <span class="text-white font-semibold">${escapeHTML(u.nama_sekolah)} (${escapeHTML(u.school_npsn)})</span>
                      ` : ''}
                    </div>
                    <h3 class="text-base sm:text-lg font-bold text-white">${escapeHTML(u.judul_usulan)}</h3>
                    <p class="text-xs sm:text-sm text-gray-300">${escapeHTML(u.keterangan || '-')}</p>
                    <div class="flex flex-wrap items-center gap-4 pt-1 text-xs text-gray-400">
                      <span>Volume: <strong class="text-white">${escapeHTML(u.volume)}</strong></span>
                      <span>Estimasi Biaya: <strong class="text-[#A3E635]">${formatRupiah(u.estimasi_biaya)}</strong></span>
                    </div>
                    ${safeImg ? `
                      <div class="mt-2.5 p-2.5 rounded-xl bg-[#0B0E0D] border border-[#232926] flex items-center gap-3 max-w-md">
                        <img src="${safeImg}" alt="Lampiran Foto Usulan"
                          onclick="openUsulanImageViewer(decodeURIComponent('${safeArg(u.id)}'))"
                          class="w-16 h-12 rounded-lg object-cover border border-[#232926] cursor-pointer shrink-0 hover:opacity-90" />
                        <div class="min-w-0 flex-1">
                          <p class="text-[11px] font-semibold text-white truncate">${escapeHTML(u.foto_nama || 'Dokumen Gambar Usulan')}</p>
                          <button type="button" onclick="openUsulanImageViewer(decodeURIComponent('${safeArg(u.id)}'))"
                            class="text-[11px] text-[#A3E635] hover:underline font-semibold inline-flex items-center gap-1 mt-0.5">
                            <i data-lucide="image" class="w-3 h-3"></i>
                            <span>Lihat Lampiran Gambar</span>
                          </button>
                        </div>
                      </div>
                    ` : ''}
                    ${u.catatan_admin ? `
                      <div class="mt-2 p-3 rounded-xl bg-[#0B0E0D] border border-emerald-500/30 text-xs text-emerald-300">
                        <strong>Disposisi Bidang Pembinaan SD:</strong> ${escapeHTML(u.catatan_admin)}
                      </div>
                    ` : ''}
                  </div>

                  <div class="flex flex-row lg:flex-col items-center lg:items-end justify-between gap-3 pt-3 lg:pt-0 border-t lg:border-t-0 border-[#232926]">
                    <span class="px-3 py-1 rounded-full text-xs font-bold border ${statusBadge}">${escapeHTML(u.status)}</span>
                    <div class="flex items-center gap-2">
                      ${isAdmin ? `
                        <button onclick="openVerifyUsulanModal(decodeURIComponent('${safeArg(u.id)}'))"
                          class="px-3.5 py-2 rounded-xl bg-[#A3E635] text-black text-xs font-bold hover:bg-lime-300 flex items-center gap-1.5">
                          <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
                          <span>Verifikasi</span>
                        </button>
                      ` : ''}
                      ${(!isAdmin && u.status === 'Menunggu') || isAdmin ? `
                        <button onclick="confirmDeleteItem('usulan', '${safeArg(u.id)}', '${safeArg(u.judul_usulan)}')"
                          class="p-2 rounded-xl bg-[#0B0E0D] hover:bg-red-500/20 border border-[#232926] text-gray-400 hover:text-red-400" title="Hapus Usulan">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      ` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 12. MAIN APP SHELL (SIDEBAR, MOBILE BOTTOM NAV & VIEWPORT)
    // =========================================================================
    function renderDashboardShell() {
      const isAdmin = state.user?.role === 'admin';
      const navItems = [
        { id: 'beranda', label: 'Beranda', icon: 'layout-dashboard' },
        { id: 'profil', label: isAdmin ? 'Data Sekolah' : 'Profil Sekolah', icon: 'school' },
        { id: 'sarana', label: 'Sarana', icon: 'monitor-smartphone' },
        { id: 'prasarana', label: 'Prasarana', icon: 'building' },
        { id: 'usulan', label: 'Usulan Sarpras', icon: 'file-plus-2' }
      ];

      let tabContent = '';
      if (state.activeTab === 'beranda') tabContent = renderBerandaTab();
      else if (state.activeTab === 'profil') tabContent = renderProfilTab();
      else if (state.activeTab === 'sarana') tabContent = renderSaranaTab();
      else if (state.activeTab === 'prasarana') tabContent = renderPrasaranaTab();
      else if (state.activeTab === 'usulan') tabContent = renderUsulanTab();

      return `
        <div class="min-h-screen bg-[#0B0E0D] text-white flex flex-col lg:flex-row">
          <!-- Desktop Left Sidebar -->
          <aside class="hidden lg:flex lg:w-64 lg:flex-col lg:fixed lg:inset-y-0 bg-[#141816] border-r border-[#232926] p-5 justify-between z-20">
            <div class="space-y-6">
              <div class="flex items-center gap-3 px-1">
                <div class="w-10 h-10 rounded-xl bg-[#0B0E0D] border border-emerald-500/30 p-1.5 flex items-center justify-center shrink-0">
                  <img src="https://i.ibb.co.com/wZd5Vn8h/Logo-Kabupaten-Kutai-Timur.png" alt="Logo Kabupaten Kutai Timur" class="w-full h-full object-contain" />
                </div>
                <div class="min-w-0">
                  <h1 class="text-sm font-extrabold tracking-tight text-white truncate">SIM-SARPRAS SD</h1>
                  <p class="text-[11px] text-[#A3E635] truncate">Disdikbud Kutai Timur</p>
                </div>
              </div>

              <div class="relative">
                <i data-lucide="search" class="w-3.5 h-3.5 text-gray-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="global-sidebar-search-input" value="${escapeHTML(state.filters.schoolSearch)}" placeholder="Cari cepat..." oninput="handleGlobalSidebarSearch(this.value)"
                  class="w-full pl-8 pr-3 py-2 rounded-xl bg-[#0B0E0D] border border-[#232926] text-xs text-white placeholder-gray-600 focus:border-[#A3E635] focus:outline-none" />
              </div>

              <nav class="space-y-1">
                ${navItems.map(item => {
                  const active = state.activeTab === item.id;
                  return `
                    <button onclick="setActiveTab('${item.id}')"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all ${
                        active
                          ? 'bg-[#A3E635] text-black lime-glow'
                          : 'text-gray-400 hover:text-white hover:bg-[#1A201D]'
                      }">
                      <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                      <span>${item.label}</span>
                    </button>
                  `;
                }).join('')}
              </nav>
            </div>

            <div class="space-y-3 pt-4 border-t border-[#232926]">
              ${renderThemeSwatchesBar()}
              <div class="p-3 rounded-xl bg-[#0B0E0D] border border-[#232926]">
                <div class="flex items-center gap-2.5">
                  <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs shrink-0">
                    ${isAdmin ? 'AD' : 'SD'}
                  </div>
                  <div class="min-w-0">
                    <p class="text-xs font-bold text-white truncate">
                      ${escapeHTML(isAdmin ? 'Admin Bidang SD' : state.user.nama_sekolah)}
                    </p>
                    <p class="text-[11px] text-gray-500 truncate">
                      ${escapeHTML(isAdmin ? state.user.email : `NPSN: ${state.user.npsn}`)}
                    </p>
                  </div>
                </div>
              </div>
              <button onclick="handleLogout()"
                class="w-full flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-[#0B0E0D] hover:bg-red-500/15 border border-[#232926] hover:border-red-500/40 text-xs font-semibold text-gray-300 hover:text-red-400 transition-colors">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                <span>Keluar Sistem</span>
              </button>
            </div>
          </aside>

          <!-- Mobile Top Header -->
          <header class="lg:hidden sticky top-0 z-20 bg-[#141816]/95 backdrop-blur-md border-b border-[#232926] px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-8 h-8 rounded-lg bg-[#0B0E0D] border border-emerald-500/30 p-1 flex items-center justify-center shrink-0">
                <img src="https://i.ibb.co.com/wZd5Vn8h/Logo-Kabupaten-Kutai-Timur.png" alt="Logo Kabupaten Kutai Timur" class="w-full h-full object-contain" />
              </div>
              <div class="min-w-0">
                <h1 class="text-sm font-bold text-white truncate">SIM-SARPRAS SD</h1>
                <p class="text-[10px] text-[#A3E635] truncate">
                  ${escapeHTML(isAdmin ? 'Admin Bidang Pembinaan SD' : state.user.nama_sekolah)}
                </p>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button onclick="openThemePickerModal()" title="Pilih Tema Warna"
                class="px-2.5 py-1.5 rounded-lg bg-[#0B0E0D] border border-[#232926] text-xs text-gray-300 hover:text-[#A3E635] flex items-center gap-1">
                <i data-lucide="palette" class="w-3.5 h-3.5 text-[#A3E635]"></i>
              </button>
              <button onclick="handleLogout()" class="px-2.5 py-1.5 rounded-lg bg-[#0B0E0D] border border-[#232926] text-xs text-gray-300 hover:text-red-400 flex items-center gap-1">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                <span>Keluar</span>
              </button>
            </div>
          </header>

          <!-- Main Viewport Content -->
          <main class="flex-1 lg:pl-64 pb-24 lg:pb-10">
            <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
              ${tabContent}
            </div>
          </main>

          <!-- Mobile Bottom Navigation Bar -->
          <nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-[#141816]/95 backdrop-blur-md border-t border-[#232926] px-2 py-1.5 grid grid-cols-5 gap-1">
            ${navItems.map(item => {
              const active = state.activeTab === item.id;
              return `
                <button onclick="setActiveTab('${item.id}')"
                  class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-colors ${
                    active ? 'text-[#A3E635] bg-[#A3E635]/10' : 'text-gray-400 hover:text-white'
                  }">
                  <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                  <span class="text-[10px] font-semibold mt-1 truncate max-w-full">${item.label.split(' ')[0]}</span>
                </button>
              `;
            }).join('')}
          </nav>
        </div>
      `;
    }

    // =========================================================================
    // 13. RENDER ENGINE & BOOTSTRAP
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('sim-sarpras-root');
      if (!root) return;

      if (!state.user) {
        root.innerHTML = renderLoginView();
      } else {
        root.innerHTML = renderDashboardShell();
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    window.addEventListener('storage', (event) => {
      if (IS_PREVIEW && event.key === 'sim_sarpras_preview_sync' && event.newValue) {
        try {
          const incoming = JSON.parse(event.newValue);
          if (incoming.schools) state.schools = incoming.schools;
          if (incoming.sarana) state.sarana = incoming.sarana;
          if (incoming.prasarana) state.prasarana = incoming.prasarana;
          if (incoming.usulan) state.usulan = incoming.usulan;

          if (state.user?.role === 'school') {
            const updatedMe = state.schools.find(s => s.npsn === state.user.npsn);
            if (updatedMe) state.user = { ...state.user, ...updatedMe };
          }
          renderApp();
        } catch (err) {}
      }
    });

    (async function bootstrap() {
      await initFirebaseIfProduction();
      renderApp();
    })();
  </script>
</body>
</html>
