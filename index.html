    function cacheLoginHeroImage(imgEl) {
      try {
        if (!imgEl || !imgEl.src || imgEl.src.startsWith("data:image/")) return;
        const maxW = 960;
        const ratio = imgEl.naturalWidth > maxW ? (maxW / imgEl.naturalWidth) : 1;
        const w = Math.max(1, Math.round(imgEl.naturalWidth * ratio));
        const h = Math.max(1, Math.round(imgEl.naturalHeight * ratio));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(imgEl, 0, 0, w, h);
        const dataUri = canvas.toDataURL("image/png");
        if (dataUri && dataUri.length > 200) {
          localStorage.setItem(LOGIN_HERO_CACHE_KEY, dataUri);
        }
      } catch (e) {}
    }

    // =========================================================================

    async function hashPasswordSHA256(plainText) {
      const text = String(plainText ?? '');
      if (!text) return '';
      if (window.crypto && window.crypto.subtle) {
        const encoder = new TextEncoder();
        const data = encoder.encode(`SIM_SARPRAS_KUTIM_SALT_2026::${text}`);
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return text;
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeArg(str) {
      return encodeURIComponent(String(str ?? ''));
    }

    function decodeArg(str) {
      try { return decodeURIComponent(String(str ?? '')); } catch (e) { return String(str ?? ''); }
    }

      const bulan = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      return `${dateObj.getDate()} ${bulan[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
    }

    function renderKecamatanOptions(selectedVal = '') {
      const list = [...new Set([...KECAMATAN_KUTIM, ...(selectedVal ? [selectedVal] : [])])];
      return list.map(k =>
        `<option value="${escapeHTML(k)}" ${k === selectedVal ? 'selected' : ''}>${escapeHTML(k)}</option>`
      ).join('');
    }

    function isValidCoordinatePair(lat, lng) {
      if (lat === '' || lng === '' || lat === null || lng === null || lat === undefined || lng === undefined) return false;
      const latNum = Number(lat);
      const lngNum = Number(lng);
      if (Number.isNaN(latNum) || Number.isNaN(lngNum)) return false;
      return latNum >= -90 && latNum <= 90 && lngNum >= -180 && lngNum <= 180;
    }

    function buildGoogleMapsLink(lat, lng) {
      return `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`;
    }

    function buildMapEmbedUrl(lat, lng) {
      const latNum = parseFloat(lat);
      const lngNum = parseFloat(lng);
      const delta = 0.008;
      const bbox = `${(lngNum - delta).toFixed(6)},${(latNum - delta).toFixed(6)},${(lngNum + delta).toFixed(6)},${(latNum + delta).toFixed(6)}`;
      return `https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${encodeURIComponent(latNum.toFixed(6))},${encodeURIComponent(lngNum.toFixed(6))}`;
    }

    window.refreshSchoolMapPreview = function(prefix) {
      const latEl = document.getElementById(`${prefix}-latitude`);
      const lngEl = document.getElementById(`${prefix}-longitude`);
      const boxEl = document.getElementById(`${prefix}-map-preview-box`);
      if (!latEl || !lngEl || !boxEl) return;

      const lat = latEl.value.trim();
      const lng = lngEl.value.trim();
      if (isValidCoordinatePair(lat, lng)) {
        boxEl.innerHTML = `
          <div class="rounded-xl overflow-hidden border border-[#232926] bg-[#141816]">
            <iframe src="${buildMapEmbedUrl(lat, lng)}" class="w-full h-40 border-0" loading="lazy"></iframe>
            <div class="px-3 py-2 bg-[#141816] border-t border-[#232926] flex items-center justify-between text-xs">
              <span class="font-mono text-[#A3E635]">${parseFloat(lat).toFixed(6)}, ${parseFloat(lng).toFixed(6)}</span>
              <a href="${buildGoogleMapsLink(lat, lng)}" target="_blank" rel="noopener noreferrer" class="text-emerald-400 hover:underline font-semibold">Buka Google Maps</a>
            </div>
          </div>
        `;
      } else {
        boxEl.innerHTML = '';
      }
    };

    window.detectCurrentSchoolLocation = function(prefix) {
      if (!navigator.geolocation) {
        showToast('Perangkat atau browser Anda tidak mendukung deteksi GPS.', 'error');
        return;
      }
      const btn = document.getElementById(`${prefix}-detect-gps-btn`);
      if (btn) btn.disabled = true;
      showToast('Sedang mendeteksi titik lokasi GPS...', 'info');

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          if (btn) btn.disabled = false;
          const latInput = document.getElementById(`${prefix}-latitude`);
          const lngInput = document.getElementById(`${prefix}-longitude`);
          if (latInput) latInput.value = pos.coords.latitude.toFixed(6);
          if (lngInput) lngInput.value = pos.coords.longitude.toFixed(6);
          refreshSchoolMapPreview(prefix);
          showToast('Titik lokasi GPS berhasil terdeteksi!', 'success');
        },
        (err) => {
          if (btn) btn.disabled = false;
          showToast(`Gagal mendeteksi lokasi GPS: ${err.message || 'Pastikan izin lokasi aktif.'}`, 'error');
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    };

    function applyAutoColumnWidths(ws, rows, minWidth = 10, maxWidth = 42) {
      if (!rows || rows.length === 0) return;
      const colCount = rows.reduce((max, r) => Math.max(max, r.length), 0);
      const cols = [];
      for (let c = 0; c < colCount; c++) {
        let longest = minWidth;
        for (let r = 0; r < rows.length; r++) {
          if (r < 3) continue;
          const cellVal = rows[r][c] !== null && rows[r][c] !== undefined ? String(rows[r][c]) : '';
          if (cellVal.length + 3 > longest) longest = cellVal.length + 3;
        }
        cols.push({ wch: Math.min(maxWidth, longest) });
      }
      ws['!cols'] = cols;
    }

    window.submitImportSarprasExcel = async function(e) {
      e.preventDefault();
      if (typeof window.XLSX === 'undefined') {
        showToast('Library Excel belum siap.', 'error');
        return;
      }
      const file = e.target.excel_file?.files?.[0];
      if (!file) return;

      const isAdmin = state.user?.role === 'admin';
      const validCategories = ['Meubelair', 'TIK', 'Alat Peraga', 'Olahraga', 'Buku'];

      try {
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: 'array' });
        let importedPras = 0;
        let importedSar = 0;

        if (wb.SheetNames.includes('Template_Prasarana')) {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets['Template_Prasarana']);
          for (const row of rows) {
            const rawNpsn = String(row['NPSN'] || '').trim();
            const npsn = isAdmin ? rawNpsn : state.user.npsn;
            const namaRuang = String(row['Nama Ruang'] || '').trim();
            if (!npsn || !namaRuang) continue;

            const schoolObj = state.schools.find(s => s.npsn === npsn);
            const pctRusak = Math.max(0, Math.min(100, Number(row['Persentase Kerusakan (%)']) || 0));
            const kondisi = pctRusak === 0 ? 'Baik' : (pctRusak <= 30 ? 'Rusak Ringan' : 'Rusak Berat');

            await saveRecord('prasarana', null, {
              school_npsn: npsn,
              nama_sekolah: schoolObj?.nama_sekolah || (isAdmin ? `SD NPSN ${npsn}` : state.user.nama_sekolah),
              jenis_ruang: String(row['Jenis Ruang'] || 'Ruang Kelas').trim(),
              nama_ruang: namaRuang,
              luas_m2: Number(row['Luas (m2)']) || 56,
              kondisi,
              persentase_kerusakan: pctRusak
            });
            importedPras++;
          }
        }

        if (wb.SheetNames.includes('Template_Sarana')) {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets['Template_Sarana']);
          for (const row of rows) {
            const rawNpsn = String(row['NPSN'] || '').trim();
            const npsn = isAdmin ? rawNpsn : state.user.npsn;
            const namaBarang = String(row['Nama Barang'] || '').trim();
            if (!npsn || !namaBarang) continue;

            const schoolObj = state.schools.find(s => s.npsn === npsn);
            const ruangNameInput = String(row['Nama Ruang Prasarana'] || '').trim();
            const matchedPras = state.prasarana.find(p =>
              p.school_npsn === npsn && p.nama_ruang.toLowerCase() === ruangNameInput.toLowerCase()
            );
            const rawCat = String(row['Kategori'] || 'Meubelair').trim();
            const kategori = validCategories.find(c => c.toLowerCase() === rawCat.toLowerCase()) || 'Meubelair';

            await saveRecord('sarana', null, {
              school_npsn: npsn,
              nama_sekolah: schoolObj?.nama_sekolah || (isAdmin ? `SD NPSN ${npsn}` : state.user.nama_sekolah),
              prasarana_id: matchedPras ? matchedPras.id : '',
              prasarana_nama: matchedPras
                ? `${matchedPras.nama_ruang} (${matchedPras.jenis_ruang})`
                : (ruangNameInput || 'Umum / Non-Ruang'),
              kategori,
              nama_barang: namaBarang,
              jumlah_baik: Number(row['Baik']) || 0,
              jumlah_rusak_ringan: Number(row['Rusak Ringan']) || 0,
              jumlah_rusak_berat: Number(row['Rusak Berat']) || 0,
              tahun_pengadaan: String(row['Tahun'] || new Date().getFullYear()).trim()
            });
            importedSar++;
          }
        }

        closeModal();
        if (importedPras === 0 && importedSar === 0) {
          showToast('Tidak ada baris valid yang ditemukan. Pastikan nama sheet adalah Template_Prasarana atau Template_Sarana.', 'error');
        } else {
          showToast(`Import berhasil: ${importedPras} Prasarana & ${importedSar} Sarana ditambahkan!`, 'success');
        }
      } catch (err) {
        showToast(err.message || 'Gagal membaca file Excel.', 'error');
      }
    };

    function preserveSearchFocus(inputEl) {
      if (!inputEl) return;
      const focusKey = inputEl.getAttribute('data-search-key');
      if (!focusKey) return;
      const selStart = inputEl.selectionStart;
      const selEnd = inputEl.selectionEnd;
      requestAnimationFrame(() => {
        const nextEl = document.querySelector(`[data-search-key="${focusKey}"]`);
        if (nextEl) {
          nextEl.focus();
          try {
            if (typeof selStart === 'number' && typeof selEnd === 'number') {
              nextEl.setSelectionRange(selStart, selEnd);
            }
          } catch (e) {}
        }
      });
    }

    function computeSarprasStats(schoolNpsn = null) {
      const targetSarana = schoolNpsn
        ? state.sarana.filter(s => s.school_npsn === schoolNpsn)
        : state.sarana;
      const targetPrasarana = schoolNpsn
        ? state.prasarana.filter(p => p.school_npsn === schoolNpsn)
        : state.prasarana;
      const targetUsulan = schoolNpsn
        ? state.usulan.filter(u => u.school_npsn === schoolNpsn)
        : state.usulan;

      let baikUnit = 0;
      let ringanUnit = 0;
      let beratUnit = 0;

      targetSarana.forEach(item => {
        baikUnit += Number(item.jumlah_baik) || 0;
        ringanUnit += Number(item.jumlah_rusak_ringan) || 0;
        beratUnit += Number(item.jumlah_rusak_berat) || 0;
      });

      targetPrasarana.forEach(room => {
        const weight = 10;
        if (room.kondisi === 'Baik') baikUnit += weight;
        else if (room.kondisi === 'Rusak Ringan') ringanUnit += weight;
        else if (room.kondisi === 'Rusak Berat') beratUnit += weight;
      });

      const totalUnit = baikUnit + ringanUnit + beratUnit;
      const pctBaik = totalUnit > 0 ? Math.round((baikUnit / totalUnit) * 100) : 0;
      const pctRingan = totalUnit > 0 ? Math.round((ringanUnit / totalUnit) * 100) : 0;
      const pctBerat = totalUnit > 0 ? Math.max(0, 100 - pctBaik - pctRingan) : 0;
      const pctRusakTotal = totalUnit > 0 ? Math.max(0, 100 - pctBaik) : 0;

      let statusLabel = 'Belum Ada Data';
      if (totalUnit > 0) {
        if (pctBerat >= 25) statusLabel = 'Rusak Berat';
        else if (pctRusakTotal >= 20) statusLabel = 'Rusak Ringan';
        else statusLabel = 'Baik';
      }

      return {
        totalSchools: state.schools.length,
        totalSaranaItems: targetSarana.length,
        totalPrasaranaItems: targetPrasarana.length,
        hasInputData: (targetSarana.length + targetPrasarana.length) > 0,
        baikUnit, ringanUnit, beratUnit, totalUnit,
        pctBaik, pctRingan, pctBerat, pctRusakTotal, statusLabel,
        totalUsulan: targetUsulan.length,
        usulanDisetujui: targetUsulan.filter(u => u.status === 'Disetujui').length,
        usulanMenunggu: targetUsulan.filter(u => u.status === 'Menunggu').length
      };
    }

    function clearFirestoreListeners() {
      if (Array.isArray(state.unsubscribers)) {
        state.unsubscribers.forEach(unsub => {
          try { if (typeof unsub === 'function') unsub(); } catch (e) {}
        });
      }
      state.unsubscribers = [];
    }

    function startRealtimeListeners() {
      if (IS_PREVIEW || !fbDb || !fbModules) return;
      clearFirestoreListeners();
      const { collection, onSnapshot } = fbModules;
      ['schools', 'sarana', 'prasarana', 'usulan'].forEach(colName => {
        const unsub = onSnapshot(
          collection(fbDb, colName),
          { includeMetadataChanges: true },
          (snap) => {
            state[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            state.syncStatus.connected = true;
            state.syncStatus.lastSyncAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            if (state.user?.role === 'school' && colName === 'schools') {
              const updatedMe = state.schools.find(s => s.npsn === state.user.npsn);
              if (updatedMe) state.user = { ...state.user, ...updatedMe };
            }
            renderApp();
          },
          (err) => {
            console.error(`Gagal sinkronisasi real-time koleksi ${colName}:`, err);
            state.syncStatus.connected = false;
          }
        );
        state.unsubscribers.push(unsub);
      });
    }

    async function saveRecord(collectionName, docId, payload) {
      const enrichedPayload = {
        ...payload,
        synced_at: new Date().toISOString()
      };

      if (IS_PREVIEW) {
        if (docId) {
          const idx = state[collectionName].findIndex(item => item.id === docId || item.npsn === docId);
          if (idx !== -1) {
            state[collectionName][idx] = { ...state[collectionName][idx], ...enrichedPayload };
          } else {
            const newId = enrichedPayload.npsn || `${collectionName}-${Date.now()}`;
            state[collectionName].unshift({ id: newId, ...enrichedPayload });
          }
        } else {
          const newId = enrichedPayload.npsn || `${collectionName}-${Date.now()}`;
          state[collectionName].unshift({ id: newId, ...enrichedPayload });
        }
        broadcastPreviewState(`Simpan ${collectionName}`);
        renderApp();
        return;
      }

      if (!fbDb || !fbModules) throw new Error("Koneksi Firebase belum siap.");
      await ensureCloudWriteAuth();
      const { collection, doc, setDoc, addDoc } = fbModules;

      if (collectionName === 'schools' && (docId || enrichedPayload.npsn)) {
        const targetSchoolDocId = String(docId || enrichedPayload.npsn);
        await setDoc(doc(fbDb, 'schools', targetSchoolDocId), enrichedPayload, { merge: true });
      } else if (docId) {
        await setDoc(doc(fbDb, collectionName, String(docId)), enrichedPayload, { merge: true });
      } else {
        await addDoc(collection(fbDb, collectionName), enrichedPayload);
      }
    }

    async function deleteRecord(collectionName, docId) {
      const targetId = String(docId ?? '');
      if (!targetId) throw new Error("ID data tidak valid untuk dihapus.");

      if (IS_PREVIEW) {
        if (collectionName === 'schools') {
          const targetSchool = state.schools.find(item => String(item.id) === targetId || String(item.npsn) === targetId);
          const targetNpsn = targetSchool?.npsn;
          state.schools = state.schools.filter(item => String(item.id) !== targetId && String(item.npsn) !== targetId);
          if (targetNpsn) {
            state.prasarana = state.prasarana.filter(p => p.school_npsn !== targetNpsn);
            state.sarana = state.sarana.filter(s => s.school_npsn !== targetNpsn);
            state.usulan = state.usulan.filter(u => u.school_npsn !== targetNpsn);
          }
        } else if (collectionName === 'prasarana') {
          state.prasarana = state.prasarana.filter(item => String(item.id) !== targetId);
          state.sarana = state.sarana.map(s =>
            String(s.prasarana_id) === targetId
              ? { ...s, prasarana_id: '', prasarana_nama: 'Umum / Non-Ruang' }
              : s
          );
          if (String(state.filters.saranaPrasarana) === targetId) {
            state.filters.saranaPrasarana = '';
          }
        } else {
          state[collectionName] = state[collectionName].filter(item => String(item.id) !== targetId);
        }
        broadcastPreviewState(`Hapus ${collectionName}`);
        renderApp();
        return;
      }

      if (!fbDb || !fbModules) throw new Error("Koneksi Firebase belum siap.");
      await ensureCloudWriteAuth();
      const { doc, deleteDoc } = fbModules;
      await deleteDoc(doc(fbDb, collectionName, targetId));
      if (collectionName === 'prasarana' && String(state.filters.saranaPrasarana) === targetId) {
        state.filters.saranaPrasarana = '';
      }
    }

      try {
        if (state.loginTab === 'school') {
          const npsn = form.npsn.value.trim();
          const password = form.password.value.trim();

          if (!npsn || !password) {
            throw new Error("Masukkan NPSN dan Kata Sandi Sekolah.");
          }

          const inputHash = await hashPasswordSHA256(password);

          if (IS_PREVIEW) {
            const matched = state.schools.find(s =>
              s.npsn === npsn && (s.password === password || (s.password_hash && s.password_hash === inputHash))
            );
            if (!matched) {
              throw new Error("NPSN atau Kata Sandi tidak cocok dengan akun demo.");
            }
            state.user = { role: 'school', ...matched };
            state.activeTab = 'beranda';
            showToast(`Selamat datang, Operator ${matched.nama_sekolah}`, 'success');
          } else {
            if (!fbDb || !fbModules) throw new Error("Koneksi Firebase belum siap.");
            await ensureCloudWriteAuth();
            const { collection, query, where, getDocs, doc, setDoc } = fbModules;
            const q = query(collection(fbDb, 'schools'), where('npsn', '==', npsn));
            const snap = await getDocs(q);
            if (snap.empty) {
              throw new Error("NPSN sekolah tidak ditemukan di database Dinas.");
            }
            const schoolDoc = snap.docs[0];
            const data = schoolDoc.data();
            const isHashMatch = Boolean(data.password_hash && data.password_hash === inputHash);
            const isPlainMatch = Boolean(data.password && data.password === password);

            if (!isHashMatch && !isPlainMatch) {
              throw new Error("Kata Sandi sekolah tidak sesuai.");
            }

            // Auto-migrasi akun lama agar memiliki password_hash SHA-256
            if (!data.password_hash && isPlainMatch) {
              try {
                await setDoc(doc(fbDb, 'schools', schoolDoc.id), { password_hash: inputHash }, { merge: true });
              } catch (migErr) {}
            }

            state.user = { role: 'school', id: schoolDoc.id, ...data, password_hash: inputHash };
            state.activeTab = 'beranda';
            startRealtimeListeners();
            showToast(`Berhasil masuk sebagai ${state.user.nama_sekolah}`, 'success');
          }
        } else {
          const email = form.email.value.trim();
          const password = form.password.value.trim();

          if (!email || !password) {
            throw new Error("Masukkan Email dan Kata Sandi Admin Bidang SD.");
          }

          if (IS_PREVIEW) {
            if (email === 'admin@dinas.go.id' && password === 'admin123') {
              state.user = {
                role: 'admin',
                email: 'admin@dinas.go.id',
                nama: 'Admin Bidang Pembinaan SD Kutim'
              };
              state.activeTab = 'beranda';
              showToast('Berhasil masuk sebagai Admin Bidang Pembinaan SD', 'success');
            } else {
              throw new Error('Kredensial Admin demo tidak valid.');
            }
          } else {
            if (!fbAuth || !fbModules) throw new Error("Firebase Authentication belum siap.");
            const { signInWithEmailAndPassword } = fbModules;
            const cred = await signInWithEmailAndPassword(fbAuth, email, password);
            state.user = {
              role: 'admin',
              uid: cred.user.uid,
              email: cred.user.email,
              nama: 'Admin Bidang Pembinaan SD Kutim'
            };
            state.activeTab = 'beranda';
            startRealtimeListeners();
            showToast('Autentikasi Admin Bidang Pembinaan SD berhasil.', 'success');
          }
        }
      } catch (err) {
        showToast(err.message || 'Gagal melakukan autentikasi.', 'error');
      } finally {
        state.loading = false;
        renderApp();
      }
    };

    // Peta GIS Interaktif Esri ArcGIS Online (Bebas API Key & Bebas Blokir Iframe)
    let adminGisMapInstance = null;

    function mountAdminGisMap() {
      const container = document.getElementById('kutim-gis-map');
      if (!container || typeof window.L === 'undefined') return;

      if (adminGisMapInstance) {
        try { adminGisMapInstance.remove(); } catch (e) {}
        adminGisMapInstance = null;
      }

      const map = L.map(container, {
        center: [0.50, 117.52],
        zoom: 10,
        scrollWheelZoom: false
      });
      adminGisMapInstance = map;

      const darkStreetLayer = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        { attribution: '© Esri ArcGIS', maxZoom: 18 }
      );
      const lightStreetLayer = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        { attribution: '© Esri ArcGIS', maxZoom: 18 }
      );
      const satelliteLayer = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { attribution: '© Esri World Imagery', maxZoom: 18 }
      );

      darkStreetLayer.addTo(map);
      container.classList.add('gis-dark-invert');

      L.control.layers({
        'Peta Jalan Gelap': darkStreetLayer,
        'Peta Jalan Terang': lightStreetLayer,
        'Citra Satelit': satelliteLayer
      }, null, { position: 'topright' }).addTo(map);

      map.on('baselayerchange', (ev) => {
        if (ev.name === 'Peta Jalan Gelap') container.classList.add('gis-dark-invert');
        else container.classList.remove('gis-dark-invert');
      });

      const bounds = [];
      state.schools.forEach(school => {
        if (!isValidCoordinatePair(school.latitude, school.longitude)) return;
        const lat = parseFloat(school.latitude);
        const lng = parseFloat(school.longitude);
        const st = computeSarprasStats(school.npsn);

        const pinColor = !st.hasInputData
          ? '#9CA3AF'
          : st.statusLabel === 'Baik'
          ? '#A3E635'
          : st.statusLabel === 'Rusak Ringan'
          ? '#FACC15'
          : '#F87171';

        const marker = L.circleMarker([lat, lng], {
          radius: 8,
          fillColor: pinColor,
          color: '#0B0E0D',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.95
        }).addTo(map);

        marker.bindPopup(`
          <div style="min-width: 190px; font-size: 12px; line-height: 1.4;">
            <div style="font-weight: 800; color: #FFFFFF; margin-bottom: 2px;">${escapeHTML(school.nama_sekolah)}</div>
            <div style="font-size: 11px; color: #9CA3AF; margin-bottom: 6px;">NPSN: ${escapeHTML(school.npsn)} • ${escapeHTML(school.kecamatan || '-')}</div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px;">
              <span style="color: #D1D5DB;">Kondisi Baik:</span>
              <strong style="color: ${pinColor};">${st.hasInputData ? `${st.pctBaik}% (${st.statusLabel})` : 'Belum Input'}</strong>
            </div>
            <button type="button" onclick="inspectSchoolFromDashboard(decodeURIComponent('${safeArg(school.npsn)}'))"
              style="width: 100%; padding: 6px 10px; border-radius: 8px; background: #A3E635; color: #000000; font-weight: 700; font-size: 11px; border: none; cursor: pointer;">
              Cek Detail Sarpras
            </button>
          </div>
        `);
        bounds.push([lat, lng]);
      });

      setTimeout(() => {
        if (!adminGisMapInstance) return;
        adminGisMapInstance.invalidateSize();
        if (bounds.length > 0) {
          adminGisMapInstance.fitBounds(bounds, { padding: [36, 36], maxZoom: 13 });
        }
      }, 150);
    }

          </table>
          ${buildSignatureBlock()}

    window.submitSchoolForm = async function(e, docId) {
      e.preventDefault();
      const f = e.target;
      const npsnVal = f.npsn.value.trim();
      const rawPassword = f.password.value.trim();
      const rawLat = f.latitude ? f.latitude.value.trim() : '';
      const rawLng = f.longitude ? f.longitude.value.trim() : '';

      if ((rawLat || rawLng) && !isValidCoordinatePair(rawLat, rawLng)) {
        showToast('Format koordinat GPS tidak valid. Latitude harus (-90 s.d 90) dan Longitude (-180 s.d 180).', 'error');
        return;
      }

      if (!docId) {
        const duplicate = state.schools.find(s => s.npsn === npsnVal);
        if (duplicate) {
          showToast(`NPSN ${npsnVal} sudah terdaftar atas nama ${duplicate.nama_sekolah}. Gunakan fitur Edit atau Generate Password.`, 'error');
          return;
        }
      }

      const passwordHash = await hashPasswordSHA256(rawPassword);
      const payload = {
        npsn: npsnVal,
        password: rawPassword,
        password_hash: passwordHash,
        nama_sekolah: f.nama_sekolah.value.trim(),
        jenjang: 'SD',
        status_sekolah: f.status_sekolah ? f.status_sekolah.value : 'Negeri',
        kecamatan: f.kecamatan.value.trim(),
        kepala_sekolah: f.kepala_sekolah.value.trim(),
        operator_nama: f.operator_nama.value.trim(),
        jumlah_siswa: Number(f.jumlah_siswa.value) || 0,
        jumlah_rombel: Number(f.jumlah_rombel.value) || 0,
        alamat: f.alamat.value.trim(),
        latitude: rawLat ? parseFloat(rawLat).toFixed(6) : '',
        longitude: rawLng ? parseFloat(rawLng).toFixed(6) : '',
        updated_at: new Date().toISOString().slice(0, 10)
      };
      try {
        await saveRecord('schools', docId, payload);
        if (state.user?.role === 'school') {
          state.user = { ...state.user, ...payload };
        }
        closeModal();
        showToast('Data profil & titik lokasi sekolah berhasil disimpan.', 'success');
        renderApp();
      } catch (err) {
        showToast(err.message || 'Gagal menyimpan data sekolah.', 'error');
      }
    };

    window.submitChangePasswordForm = async function(e) {
      e.preventDefault();
      const f = e.target;
      const oldPass = f.old_password.value.trim();
      const newPass = f.new_password.value.trim();
      const confirmPass = f.confirm_password.value.trim();

      const currentSchool = state.schools.find(s => s.npsn === state.user?.npsn) || state.user;
      if (oldPass !== (currentSchool?.password || '')) {
        showToast('Kata sandi lama tidak sesuai.', 'error');
        return;
      }
      if (newPass !== confirmPass) {
        showToast('Konfirmasi kata sandi baru tidak cocok.', 'error');
        return;
      }

      try {
        const targetId = currentSchool?.id || state.user?.npsn;
        const newHash = await hashPasswordSHA256(newPass);
        await saveRecord('schools', targetId, {
          password: newPass,
          password_hash: newHash,
          updated_at: new Date().toISOString().slice(0, 10)
        });
        if (state.user) {
          state.user.password = newPass;
          state.user.password_hash = newHash;
        }
        closeModal();
        showToast('Kata sandi akun sekolah berhasil diperbarui.', 'success');
      } catch (err) {
        showToast(err.message || 'Gagal memperbarui kata sandi.', 'error');
      }
    };

    window.submitPrasaranaForm = async function(e, docId) {
      e.preventDefault();
      const f = e.target;
      const npsn = f.school_npsn.value;
      const schoolObj = state.schools.find(s => s.npsn === npsn) || state.user;
      const selectedJenis = f.jenis_ruang.value;
      const finalJenisRuang = selectedJenis === 'Lainnya'
        ? (f.jenis_ruang_lainnya?.value.trim() || 'Lainnya')
        : selectedJenis;

      const payload = {
        school_npsn: npsn,
        nama_sekolah: schoolObj?.nama_sekolah || '-',
        jenis_ruang: finalJenisRuang,
        nama_ruang: f.nama_ruang.value.trim(),
        luas_m2: Number(f.luas_m2.value) || 0,
        kondisi: f.kondisi.value,
        persentase_kerusakan: Number(f.persentase_kerusakan.value) || 0
      };
      try {
        await saveRecord('prasarana', docId, payload);
        closeModal();
        showToast('Data prasarana berhasil disimpan.', 'success');
      } catch (err) {
        showToast(err.message || 'Gagal menyimpan prasarana.', 'error');
      }
    };

    window.syncUsulanDimensiVisibility = function() {
      const jenisEl = document.getElementById('usulan-jenis-select');
      const dimWrap = document.getElementById('usulan-dimensi-wrapper');
      const panjangEl = document.getElementById('usulan-panjang-input');
      const lebarEl = document.getElementById('usulan-lebar-input');
      const luasEl = document.getElementById('usulan-luas-preview');
      if (!jenisEl || !dimWrap) return;

      const isPrasarana = jenisEl.value === 'Rehabilitasi Prasarana' || jenisEl.value === 'Pembangunan Prasarana';
      if (isPrasarana) {
        dimWrap.classList.remove('hidden');

        if (lebarEl) lebarEl.required = true;
      } else {
        dimWrap.classList.add('hidden');

        if (lebarEl) { lebarEl.required = false; lebarEl.value = ''; }

    window.updateUsulanLuasPreview = function() {
      const panjangEl = document.getElementById('usulan-panjang-input');
      const lebarEl = document.getElementById('usulan-lebar-input');
      const luasEl = document.getElementById('usulan-luas-preview');
      if (!panjangEl || !lebarEl || !luasEl) return;

      const p = parseFloat(panjangEl.value) || 0;
      const l = parseFloat(lebarEl.value) || 0;
      const luas = p * l;
      luasEl.textContent = `${luas > 0 ? luas.toFixed(2).replace(/\.00$/, '') : '0'} m²`;
    };

    window.syncUsulanSatuanAndCustom = function() {
      const itemEl = document.getElementById('usulan-item-select');

      const customInput = document.getElementById('usulan-custom-input');
      const satuanLabel = document.getElementById('usulan-satuan-label');
      const satuanHidden = document.getElementById('usulan-satuan-hidden');
      if (!itemEl) return;

      const selectedOpt = itemEl.options[itemEl.selectedIndex];
      const val = itemEl.value || '';
      const satuan = selectedOpt?.getAttribute('data-satuan') || 'unit';

      if (satuanLabel) satuanLabel.textContent = satuan;
      if (satuanHidden) satuanHidden.value = satuan;

      const isCustom = val.startsWith('USULAN LAINNYA');
      if (customWrap && customInput) {
        if (isCustom) {
          customWrap.classList.remove('hidden');
          customInput.required = true;

    function formatFileSizeBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 KB';
      if (bytes >= 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      return `${Math.max(1, Math.round(bytes / 1024))} KB`;
    }

    function estimateDataUrlBytes(dataUrl) {
      const commaIdx = dataUrl.indexOf(',');
      const b64Len = commaIdx >= 0 ? (dataUrl.length - commaIdx - 1) : dataUrl.length;
      return Math.round((b64Len * 3) / 4);
    }

    window.handleUsulanImageUpload = function(e) {
      const file = e.target?.files?.[0];
      if (!file) return;

      const isImageMime = file.type && file.type.startsWith('image/');
      const isImageExt = /\.(jpe?g|png|webp|gif|bmp|svg|ico|tiff?|avif|heic|heif|jfif)$/i.test(file.name);
      if (!isImageMime && !isImageExt) {
        showToast('File yang dipilih bukan gambar. Silakan pilih file gambar.', 'error');
        e.target.value = '';
        return;
      }

      const originalSizeLabel = formatFileSizeBytes(file.size);
      const statusEl = document.getElementById('usulan-foto-status');
      if (statusEl) statusEl.textContent = `Mengompres gambar (${originalSizeLabel})...`;

      const applyProcessedImage = function(dataUrl) {
        const finalSizeLabel = formatFileSizeBytes(estimateDataUrlBytes(dataUrl));
        const hiddenData = document.getElementById('usulan-foto-data');
        const hiddenName = document.getElementById('usulan-foto-name');
        const previewBox = document.getElementById('usulan-foto-preview-box');
        const previewImg = document.getElementById('usulan-foto-preview-img');
        const filenameEl = document.getElementById('usulan-foto-filename');

        if (hiddenData) hiddenData.value = dataUrl;
        if (hiddenName) hiddenName.value = file.name;
        if (previewImg) previewImg.src = dataUrl;
        if (filenameEl) filenameEl.textContent = `${file.name} (${originalSizeLabel} → ${finalSizeLabel})`;
        if (previewBox) previewBox.classList.remove('hidden');
        if (statusEl) statusEl.textContent = `Terkompresi otomatis (${originalSizeLabel} → ${finalSizeLabel})`;
        showToast(`Gambar berhasil dikompres (${originalSizeLabel} → ${finalSizeLabel}) dan siap dikirim.`, 'success');
      };

      const objectUrl = URL.createObjectURL(file);
      const img = new Image();

      img.onload = function() {
        try {
          const maxPayloadLength = 600000;
          const compressionSteps = [
            { maxDim: 1280, quality: 0.82 },
            { maxDim: 1024, quality: 0.74 },
            { maxDim: 860, quality: 0.65 },
            { maxDim: 720, quality: 0.56 },
            { maxDim: 600, quality: 0.48 }
          ];

          const srcW = img.naturalWidth || img.width || 1024;
          const srcH = img.naturalHeight || img.height || 768;
          let bestDataUrl = '';

          for (const step of compressionSteps) {
            let width = srcW;
            let height = srcH;
            if (width > step.maxDim || height > step.maxDim) {
              if (width > height) {
                height = Math.max(1, Math.round((height * step.maxDim) / width));
                width = step.maxDim;
              } else {
                width = Math.max(1, Math.round((width * step.maxDim) / height));
                height = step.maxDim;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            bestDataUrl = canvas.toDataURL('image/jpeg', step.quality);
            if (bestDataUrl.length <= maxPayloadLength) {
              break;
            }
          }

          URL.revokeObjectURL(objectUrl);
          applyProcessedImage(bestDataUrl);
        } catch (err) {
          URL.revokeObjectURL(objectUrl);
          const fallbackReader = new FileReader();
          fallbackReader.onload = function(ev) {
            applyProcessedImage(ev.target.result);
          };
          fallbackReader.readAsDataURL(file);
        }
      };

      img.onerror = function() {
        URL.revokeObjectURL(objectUrl);
        const reader = new FileReader();
        reader.onload = function(ev) {
          const rawDataUrl = ev.target.result;
          if (rawDataUrl.length <= 750000) {
            applyProcessedImage(rawDataUrl);
          } else {
            showToast('Format gambar khusus ini tidak dapat dikompresi oleh browser dan ukurannya melebihi batas database.', 'error');
            if (statusEl) statusEl.textContent = 'Gagal mengompres gambar';
          }
        };
        reader.readAsDataURL(file);
      };

      img.src = objectUrl;
    };

    function generatePasswordFromNpsn(npsn, mode = 'npsn_acak') {
      const cleanNpsn = String(npsn || '').trim();
      if (mode === 'sama_npsn') return cleanNpsn;
      if (mode === 'sd_npsn') return `SD${cleanNpsn}`;
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let suffix = '';
      for (let i = 0; i < 4; i++) {
        suffix += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      const prefix = cleanNpsn.slice(-4) || 'KUTM';
      return `${prefix}-${suffix}`;
    }

            updated_at: today
          });
          showToast(`Password akun NPSN ${npsn} (${nama_sekolah}) berhasil diperbarui!`, 'success');
        } else {

            password_hash: passwordHash,
            nama_sekolah,
            jenjang: 'SD',
            status_sekolah: 'Negeri',

          });

    window.submitBulkImportSchools = async function(e) {
      e.preventDefault();
      const raw = e.target.bulk_text.value.trim();
      if (!raw) return;

      const lines = raw.split(/\r?\n/).filter(l => l.trim());
      const today = new Date().toISOString().slice(0, 10);
      const existingNpsnSet = new Set(state.schools.map(s => s.npsn));
      const newRecords = [];
      let skippedCount = 0;

      for (const line of lines) {
        const parts = line.includes('\t') ? line.split('\t') : line.split(/[,;|]/);
        const npsn = (parts[0] || '').trim();
        const nama_sekolah = (parts[1] || '').trim();
        const kecamatan = (parts[2] || 'Kec. Sangatta Utara').trim();

        if (!npsn || !nama_sekolah) continue;
        if (existingNpsnSet.has(npsn)) {
          skippedCount++;
          continue;
        }
        existingNpsnSet.add(npsn);

        const rawPwd = `SD${npsn}`;
        const pwdHash = await hashPasswordSHA256(rawPwd);
        newRecords.push({
          id: npsn,
          npsn,
          password: rawPwd,
          password_hash: pwdHash,
          nama_sekolah,
          jenjang: 'SD',
          status_sekolah: nama_sekolah.toUpperCase().includes('SDN') || nama_sekolah.toUpperCase().includes('NEGERI') ? 'Negeri' : 'Swasta',
          kecamatan,
          alamat: '-',
          latitude: '',
          longitude: '',
          kepala_sekolah: '-',
          operator_nama: '-',
          jumlah_siswa: 0,
          jumlah_rombel: 0,
          updated_at: today
        });
      }

      if (newRecords.length > 0) {
        if (IS_PREVIEW) {
          state.schools = [...newRecords, ...state.schools];
          broadcastPreviewState(`Import massal ${newRecords.length} Sekolah Dasar`);
        } else if (fbDb && fbModules?.writeBatch) {
          await ensureCloudWriteAuth();
          const { writeBatch, doc } = fbModules;
          for (let i = 0; i < newRecords.length; i += 450) {
            const batch = writeBatch(fbDb);
            newRecords.slice(i, i + 450).forEach(rec => {
              batch.set(doc(fbDb, 'schools', rec.npsn), rec);
            });
            await batch.commit();
          }
        } else {
          for (const rec of newRecords) {
            await saveRecord('schools', null, rec);
          }
        }
      }

      closeModal();
      showToast(`Import selesai: ${newRecords.length} sekolah ditambahkan${skippedCount > 0 ? `, ${skippedCount} dilewati (NPSN sudah ada)` : ''}.`, 'success');
      renderApp();
    };

    window.seed320SchoolsBenchmark = function() {
      if (!IS_PREVIEW) return;
      const today = new Date().toISOString().slice(0, 10);
      const existingSet = new Set(state.schools.map(s => s.npsn));
      const generated = [];
      let counter = 1;

      while (state.schools.length + generated.length < 320 && counter <= 400) {
        const kec = KECAMATAN_KUTIM[(counter - 1) % KECAMATAN_KUTIM.length];
        const kecShort = kec.replace('Kec. ', '');
        const noUrut = String(Math.ceil(counter / KECAMATAN_KUTIM.length)).padStart(3, '0');
        const isSwasta = counter % 9 === 0;
        const npsn = String(30401000 + counter);

        if (!existingSet.has(npsn)) {
          existingSet.add(npsn);
          generated.push({
            id: npsn,
            npsn,
            password: `SD${npsn}`,
            nama_sekolah: isSwasta ? `SD Swasta YPPSB / IT ${noUrut} ${kecShort}` : `SD Negeri ${noUrut} ${kecShort}`,
            jenjang: 'SD',
            status_sekolah: isSwasta ? 'Swasta' : 'Negeri',
            kecamatan: kec,
            alamat: `Jl. Pendidikan No. ${counter}, ${kecShort}`,
            latitude: (0.45 + ((counter % 45) * 0.008)).toFixed(6),
            longitude: (117.15 + ((counter % 60) * 0.009)).toFixed(6),
            kepala_sekolah: `Kepala Sekolah SD ${noUrut}, S.Pd`,
            operator_nama: `Operator SD ${noUrut}`,
            jumlah_siswa: 120 + ((counter * 17) % 380),
            jumlah_rombel: 6 + (counter % 12),
            updated_at: today
          });
        }
        counter++;
      }

      state.schools = [...state.schools, ...generated];
      broadcastPreviewState(`Simulasi ${state.schools.length} Sekolah Dasar se-Kutai Timur dimuat`);
      closeModal();
      showToast(`Database kini menampung ${state.schools.length} Sekolah Dasar di 18 Kecamatan Kutai Timur!`, 'success');
      renderApp();
    };

        ? (state.filters.saranaSchool === 'ALL' ? state.prasarana : state.prasarana.filter(p => p.school_npsn === state.filters.saranaSchool))

                <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-400"></i>
                <span>Import Excel</span>

              <button onclick="printActiveMenuReport('sarana')" class="px-4 py-2.5 rounded-xl bg-[#141816] border border-[#232926] hover:border-[#A3E635] text-white text-xs sm:text-sm font-semibold flex items-center gap-2 transition-colors">

                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Tambah Sarana</span>
              </button>
            </div>
          </div>

          <div class="bento-card p-4 flex flex-col md:flex-row md:items-center gap-3 flex-wrap">

              <input type="text" data-search-key="sarana-search" value="${escapeHTML(state.filters.saranaSearch)}" oninput="updateFilter('saranaSearch', this.value, this)"
                placeholder="Cari nama barang, ruang, atau sekolah..."
                class="w-full pl-10 pr-8 py-2 rounded-xl bg-[#0B0E0D] border border-[#232926] text-xs sm:text-sm text-white focus:border-[#A3E635] focus:outline-none" />
              ${state.filters.saranaSearch ? `
                <button type="button" onclick="updateFilter('saranaSearch', '')" title="Hapus pencarian"

            ${isAdmin ? `
              <select onchange="updateFilter('saranaSchool', this.value); updateFilter('saranaPrasarana', '');"
                class="px-3.5 py-2 rounded-xl bg-[#0B0E0D] border border-[#232926] text-xs sm:text-sm text-white focus:border-[#A3E635] focus:outline-none">
                <option value="ALL">Semua Sekolah Dasar</option>
                ${state.schools.map(s => `<option value="${escapeHTML(s.npsn)}" ${state.filters.saranaSchool === s.npsn ? 'selected' : ''}>${escapeHTML(s.nama_sekolah)}</option>`).join('')}
              </select>
            ` : ''}
            <select onchange="updateFilter('saranaPrasarana', this.value)"
              class="px-3.5 py-2 rounded-xl bg-[#0B0E0D] border border-[#232926] text-xs sm:text-sm text-white focus:border-[#A3E635] focus:outline-none">

            </select>
            <select onchange="updateFilter('saranaKategori', this.value)"

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">

                        <td class="py-3.5 px-4 text-center font-bold text-red-400 tabular-nums">${formatNumber(rb)}</td>
                        <td class="py-3.5 px-4 text-center font-bold text-[#A3E635] tabular-nums">${pct}%</td>
                        <td class="py-3.5 px-4 text-right">
                          <div class="inline-flex items-center gap-1.5">

                            </button>
                            <button onclick="confirmDeleteItem('sarana', '${safeArg(item.id)}', '${safeArg(item.nama_barang)}')"

                            </button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

              <option value="Baik" ${state.filters.prasaranaKondisi === 'Baik' ? 'selected' : ''}>Kondisi Baik</option>
              <option value="Rusak Ringan" ${state.filters.prasaranaKondisi === 'Rusak Ringan' ? 'selected' : ''}>Rusak Ringan</option>
              <option value="Rusak Berat" ${state.filters.prasaranaKondisi === 'Rusak Berat' ? 'selected' : ''}>Rusak Berat</option>
            </select>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            ${filtered.length === 0 ? `
              <div class="md:col-span-2 xl:col-span-3 bento-card p-10 text-center text-gray-500 text-sm">
                Belum ada data prasarana yang tercatat.
              </div>
            ` : filtered.map(item => {
              const condStyle = item.kondisi === 'Baik'
                ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30'
                : item.kondisi === 'Rusak Ringan'
                ? 'bg-amber-500/15 text-amber-400 border-amber-500/30'
                : 'bg-red-500/15 text-red-400 border-red-500/30';
              const linkedSarana = state.sarana.filter(s => s.prasarana_id === item.id);
              const totalLinkedUnits = linkedSarana.reduce((sum, s) => sum + (Number(s.jumlah_baik) || 0) + (Number(s.jumlah_rusak_ringan) || 0) + (Number(s.jumlah_rusak_berat) || 0), 0);

              return `
                <div class="bento-card p-5 flex flex-col justify-between gap-4">
                  <div>
                    <div class="flex items-center justify-between gap-2">
                      <span class="px-2.5 py-1 rounded-lg bg-[#0B0E0D] border border-[#232926] text-xs font-semibold text-[#A3E635]">${escapeHTML(item.jenis_ruang)}</span>
                      <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${condStyle}">${escapeHTML(item.kondisi)}</span>
                    </div>
                    <h3 class="text-base font-bold text-white mt-3">${escapeHTML(item.nama_ruang)}</h3>
                    ${isAdmin ? `<p class="text-xs text-gray-400 mt-1">${escapeHTML(item.nama_sekolah)} (${escapeHTML(item.school_npsn)})</p>` : ''}

                    <div class="mt-4">
                      <div class="flex items-center justify-between text-xs mb-1">
                        <span class="text-gray-400">Tingkat Kerusakan</span>
                        <span class="font-bold text-white tabular-nums">${item.persentase_kerusakan}%</span>

                      <div class="w-full h-2 rounded-full bg-[#0B0E0D] border border-[#232926] overflow-hidden">
                        <div class="h-full rounded-full ${item.kondisi === 'Baik' ? 'bg-emerald-400' : item.kondisi === 'Rusak Ringan' ? 'bg-amber-400' : 'bg-red-400'}"
                          style="width: ${Math.max(6, Number(item.persentase_kerusakan) || 0)}%"></div>
                      </div>
                    </div>

                    <div class="mt-3 p-2.5 rounded-xl bg-[#0B0E0D] border border-[#232926] flex items-center justify-between text-xs">
                      <span class="text-gray-400">Sarana di Ruang Ini:</span>
                      <span class="font-bold text-[#A3E635]">${linkedSarana.length} Jenis (${formatNumber(totalLinkedUnits)} Unit)</span>
                    </div>
                  </div>

                  <div class="flex items-center justify-between pt-3 border-t border-[#232926] text-xs text-gray-400 gap-2">
                    <span>Luas: <strong class="text-white">${formatNumber(item.luas_m2)} m²</strong></span>
                    <div class="flex items-center gap-1.5">
                      <button onclick="filterSaranaByPrasarana(decodeURIComponent('${safeArg(item.id)}'))"
                        class="px-2.5 py-1.5 rounded-lg bg-[#0B0E0D] hover:bg-[#1A201D] border border-[#232926] text-[#A3E635] font-semibold" title="Lihat Sarana di Ruang Ini">
                        Sarana (${linkedSarana.length})
                      </button>
                      <button onclick="openPrasaranaFormModal(decodeURIComponent('${safeArg(item.id)}'))"
                        class="p-1.5 rounded-lg bg-[#0B0E0D] hover:bg-[#1A201D] border border-[#232926] text-gray-300 hover:text-[#A3E635]" title="Edit">
                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                      </button>
                      <button onclick="confirmDeleteItem('prasarana', '${safeArg(item.id)}', '${safeArg(item.nama_ruang)}')"
                        class="p-1.5 rounded-lg bg-[#0B0E0D] hover:bg-red-500/20 border border-[#232926] text-gray-400 hover:text-red-400" title="Hapus">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // TAB 5: USULAN SARPRAS
    function renderUsulanTab() {
      const isAdmin = state.user?.role === 'admin';
      const baseList = isAdmin ? state.usulan : state.usulan.filter(u => u.school_npsn === state.user.npsn);

      const filtered = baseList.filter(item => {
        const q = state.filters.usulanSearch.toLowerCase();
        const matchQ = !q || item.judul_usulan.toLowerCase().includes(q) || (item.nama_sekolah || '').toLowerCase().includes(q);
        const matchStatus = state.filters.usulanStatus === 'ALL' || item.status === state.filters.usulanStatus;
        return matchQ && matchStatus;
      });

      const totalAnggaran = filtered.reduce((sum, u) => sum + (Number(u.estimasi_biaya) || 0), 0);

      return `
        <div class="space-y-6 animate-fade-in">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl font-bold text-white">
                ${isAdmin ? 'Verifikasi Usulan Sarpras Sekolah Dasar' : 'Usulan Pengadaan & Rehabilitasi Sarpras'}
              </h2>
              <p class="text-xs sm:text-sm text-gray-400 mt-0.5">
                ${isAdmin
                  ? `Tinjau, setujui, dan berikan disposisi pada usulan anggaran dari SD se-Kutai Timur (Total Estimasi: ${formatRupiah(totalAnggaran)})`

            <div class="flex flex-wrap items-center gap-2">

                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Buat Usulan Baru</span>
                </button>
              ` : ''}
            </div>
          </div>

          <div class="bento-card p-4 flex flex-col md:flex-row md:items-center gap-3">
            <div class="relative flex-1">
              <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="text" data-search-key="usulan-search" value="${escapeHTML(state.filters.usulanSearch)}" oninput="updateFilter('usulanSearch', this.value, this)"

              ${state.filters.usulanSearch ? `
                <button type="button" onclick="updateFilter('usulanSearch', '')" title="Hapus pencarian"

            <select onchange="updateFilter('usulanStatus', this.value)"

              <option value="ALL">Semua Status Verifikasi</option>

                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      ` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

                      <i data-lucide="${item.icon}" class="w-4 h-4"></i>

            </div>

            <div class="space-y-3 pt-4 border-t border-[#232926]">
              ${renderThemeSwatchesBar()}
              <div class="p-3 rounded-xl bg-[#0B0E0D] border border-[#232926]">
                <div class="flex items-center gap-2.5">
                  <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs shrink-0">
                    ${isAdmin ? 'AD' : 'SD'}
                  </div>
                  <div class="min-w-0">
                    <p class="text-xs font-bold text-white truncate">
                      ${escapeHTML(isAdmin ? 'Admin Bidang SD' : state.user.nama_sekolah)}
                    </p>
                    <p class="text-[11px] text-gray-500 truncate">

                <div class="mt-2.5 pt-2 border-t border-[#232926] flex items-center justify-between text-[10px]">

            <div class="flex items-center gap-2 shrink-0">
              <button onclick="openThemePickerModal()" title="Pilih Tema Warna"

    // =========================================================================
    // 11. RENDER ENGINE & BOOTSTRAP
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('sim-sarpras-root');
      if (!root) return;

      if (!state.user) {
        root.innerHTML = renderLoginView();
      } else {
        root.innerHTML = renderDashboardShell();
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }

      if (state.user?.role === 'admin' && state.activeTab === 'beranda') {
        requestAnimationFrame(() => mountAdminGisMap());
      }
    }

    window.addEventListener('storage', (event) => {
      if (IS_PREVIEW && event.key === 'sim_sarpras_preview_sync' && event.newValue) {
        try {
          const incoming = JSON.parse(event.newValue);
          if (incoming.schools) state.schools = incoming.schools;
          if (incoming.sarana) state.sarana = incoming.sarana;
          if (incoming.prasarana) state.prasarana = incoming.prasarana;
          if (incoming.usulan) state.usulan = incoming.usulan;

          if (state.user?.role === 'school') {
            const updatedMe = state.schools.find(s => s.npsn === state.user.npsn);
            if (updatedMe) state.user = { ...state.user, ...updatedMe };
          }
          renderApp();
        } catch (err) {}
      }
    });

    (async function bootstrap() {
      await initFirebaseIfProduction();
      renderApp();
    })();
  </script>
</body>
</html>
